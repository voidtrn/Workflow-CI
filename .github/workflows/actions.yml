name: Workflow CI Andre Kautsar

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: "3.12.7"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas numpy scikit-learn
    - name: Run MLflow Project
      env:
        MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      run: |
          mkdir -p mlruns
          mlflow run MLProject --env-manager=local -P data_dir=MLProject/student-performance_preprocessing
    - name: Commit outputs
      run: |
        git config user.name "voidtrn"
        git config user.email "ktsr.andre@gmail.com"
        git add -A
        git diff-index --quiet HEAD || (git commit -a -m "Output mlflow commit" --allow-empty)
    - name: Push Changes
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: master
